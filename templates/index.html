<!DOCTYPE html>
<html lang="en">
<style>
    h1 {text-align: center;}
    div {text-align: center;}
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperChess</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="game-header">
        <a href="/" class="back-btn">← Back to Lobby</a>
        <h1>SuperChess</h1>
        <div id="mode-badge"></div>
    </div>
    <div id="status">Turn: white | Status: active</div>

    <!-- Powerup pending banner -->
    <div id="pu-banner" style="display:none"></div>

    <div class="game-layout">
        <!-- Left: power-up hand for white -->
        <div id="powerup-panel" class="powerup-panel" style="display:none">
            <div class="pu-panel-title">⚡ Power-Ups</div>
            <div class="pu-turn-label" id="pu-turn-label"></div>
            <div id="pu-hand"></div>
        </div>

        <!-- Center: board -->
        <div id="board" class="chessboard"></div>
    </div>

    <script>
        const GAME_ID = "{{ game_id }}";
    </script>
    <script src="/static/js/main.js"></script>
</body>
</html>
